<header class="site-header">
  <div class="wrap">
    <a class="home" href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>{{ site.data.profile.name }}</a>
    <nav aria-label="Site">
      <ul>
        {%- for item in site.data.nav %}
        {%- assign item_url = item.url | relative_url %}
        <li><a href="{{ item_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
