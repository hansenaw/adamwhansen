<!doctype html>
<!-- Source for assets/img/og-card.png, the 1200×630 image shown when the site is shared.
     Re-render with: tools/render.sh tools/og-card.html assets/img/og-card.png 1200 630 -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Newsreader"; font-weight: 400 700; src: url("../assets/fonts/newsreader-latin.woff2") format("woff2"); }
  html, body { margin: 0; background: #f6f1e8; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 84px 96px;
    background: #f6f1e8;
    color: #1f1a17;
    font-family: "Newsreader", Charter, Georgia, serif;
    overflow: hidden;
  }
  .rule {
    position: absolute;
    left: 96px;
    top: 0;
    width: 72px;
    height: 8px;
    background: #8e2c38;
  }
  .site {
    margin: 0;
    font: 500 24px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.02em;
    color: #675e55;
  }
  h1 {
    margin: 112px 0 0;
    font-size: 70px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.015em;
  }
  .role {
    margin: 30px 0 0;
    font: 400 34px/1.35 -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #4a423b;
  }
  img {
    position: absolute;
    right: 96px;
    top: 84px;
    width: 240px;
    height: 300px;
    border-radius: 4px;
  }
  .foot {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 76px;
    padding-top: 26px;
    border-top: 2px solid #e0d7c8;
    font: 400 26px/1.3 -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #675e55;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="rule"></div>
    <p class="site">adamwhansen.com</p>
    <img src="../assets/img/adam-hansen-portrait.jpg" alt="">
    <h1>Adam W. Hansen, PhD</h1>
    <p class="role">Computational geneticist<br>Founder and CEO of Geneial</p>
    <p class="foot">Rare-disease genomics · Patient-centered research infrastructure · AI for health data</p>
  </div>
</body>
</html>
