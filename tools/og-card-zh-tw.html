<!doctype html>
<!-- Source for assets/img/og-card-zh-tw.png, the share image used only by the /zh-tw/ pages.
     Re-render with: tools/render.sh tools/og-card-zh-tw.html assets/img/og-card-zh-tw.png 1200 630
     Chinese text uses the Mac's built-in Songti TC and PingFang TC. -->
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Newsreader"; font-weight: 400 700; src: url("../assets/fonts/newsreader-latin.woff2") format("woff2"); }
  html, body { margin: 0; background: #f6f1e8; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 84px 96px;
    background: #f6f1e8;
    color: #1f1a17;
    font-family: "Newsreader", "Songti TC", serif;
    overflow: hidden;
  }
  .rule {
    position: absolute;
    left: 96px;
    top: 0;
    width: 72px;
    height: 8px;
    background: #8e2c38;
  }
  .site {
    margin: 0;
    font: 500 24px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.02em;
    color: #675e55;
  }
  h1 {
    margin: 96px 0 0;
    font-family: "Songti TC", serif;
    font-size: 84px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.06em;
  }
  .latin {
    margin: 22px 0 0;
    font-size: 36px;
    font-weight: 500;
    line-height: 1;
    color: #4a423b;
  }
  .role {
    margin: 26px 0 0;
    font: 400 32px/1.45 "PingFang TC", -apple-system, sans-serif;
    color: #4a423b;
  }
  img {
    position: absolute;
    right: 96px;
    top: 84px;
    width: 240px;
    height: 300px;
    border-radius: 4px;
  }
  .foot {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 76px;
    padding-top: 26px;
    border-top: 2px solid #e0d7c8;
    font: 400 26px/1.3 "PingFang TC", -apple-system, sans-serif;
    color: #675e55;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="rule"></div>
    <p class="site">adamwhansen.com</p>
    <img src="../assets/img/adam-hansen-portrait.jpg" alt="">
    <h1>漢曉陽</h1>
    <p class="latin">Adam W. Hansen, PhD</p>
    <p class="role">計算遺傳學家 · Geneial 創辦人暨執行長</p>
    <p class="foot">罕見疾病基因體學 · 以病患為中心的研究基礎設施 · 健康資料 AI</p>
  </div>
</body>
</html>
